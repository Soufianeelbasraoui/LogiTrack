spring.application.name=LogiTrack
spring.datasource.url=jdbc:mysql://localhost:3306/LogiTrack
spring.datasource.username=root
spring.datasource.password=1234

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
jwt.secret=1234567890123456789012345678901234567890123456789012345678901234
jwt.expiration=86400000
notification.service.url=http://localhost:8081